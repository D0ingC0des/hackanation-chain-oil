name: ChainOil CI — Build, Unit Tests & Integration Tests

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:

env:
  SOLANA_VERSION: "2.1.21"
  ANCHOR_VERSION: "0.31.1"
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Unit Tests — frontend services + edge function logic (sempre roda) ──
  unit-tests:
    name: Unit Tests (Vitest + Deno)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install deps
        run: npm install

      - name: Run Vitest (services + formatters + impact)
        run: npm test
        env:
          VITE_SUPABASE_URL: https://test-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: test-placeholder-anon-key

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno tests (edge function logic)
        run: deno test supabase/functions/_tests/ --allow-net --allow-env

  # ── Job 2: Build Anchor Program (sempre roda) ─────────────────────────────
  anchor-build:
    name: Build Anchor Program
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('anchor/Cargo.lock', 'anchor/programs/chain-oil/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor via AVM
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force --locked
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Set up Node for Anchor tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Anchor test deps
        working-directory: anchor
        run: npm install

      - name: Build program (generates IDL + TypeScript types)
        working-directory: anchor
        run: anchor build

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: chain-oil-idl
          path: anchor/target/idl/chain_oil.json

  # ── Job 3: Anchor Integration Tests (devnet — requer wallet secret) ─────────
  anchor-integration-tests:
    name: Anchor Integration Tests (devnet)
    runs-on: ubuntu-latest
    needs: anchor-build
    if: ${{ vars.RUN_DEVNET_TESTS == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('anchor/Cargo.lock', 'anchor/programs/chain-oil/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor via AVM
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force --locked
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Anchor test deps
        working-directory: anchor
        run: npm install

      - name: Configure Solana wallet (devnet)
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.DEVNET_WALLET_JSON }}' > ~/.config/solana/id.json
          solana config set --url devnet

      - name: Build program
        working-directory: anchor
        run: anchor build

      - name: Run integration tests (devnet)
        working-directory: anchor
        env:
          ANCHOR_PROVIDER_URL: ${{ secrets.DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}
          ANCHOR_WALLET: ~/.config/solana/id.json
        run: anchor test --skip-local-validator

# ── Para ativar o Job 3 no GitHub: ──────────────────────────────────────────
# Settings → Secrets → DEVNET_WALLET_JSON (conteúdo do ~/.config/solana/id.json)
# Settings → Variables → RUN_DEVNET_TESTS = true
